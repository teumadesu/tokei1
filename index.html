<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ニュース速報風 デジタルクロック</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #000;
      font-family: 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', 'メイリオ', sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .screen-container {
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ==========================================
       防災情報テロップ
       ========================================== */
    .alert-bar {
      display: none;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border-bottom: 4px solid rgba(255, 255, 255, 0.4);
      z-index: 900;
      transition: background-color 0.3s, color 0.3s;
    }
    .alert-title { font-size: 1.8rem; }
    .alert-text { font-size: 1.4rem; margin-left: 15px; }

    /* テロップカラーバリエーション */
    .alert-bar.eew-warning { background-color: #ffd700; color: #000; }
    .alert-bar.eew-alert {
      background-color: #d32f2f;
      color: #fff;
      animation: blink-red 1s infinite alternate;
    }
    .alert-bar.seismic-info { background-color: #0055ff; color: #fff; }
    .alert-bar.tsunami-info { background-color: #ff6600; color: #fff; }

    @keyframes blink-red {
      0% { background-color: #d32f2f; }
      100% { background-color: #990000; }
    }

    /* ==========================================
       メニューバー（サイドパネル）
       ========================================== */
    .menu-toggle-btn {
      position: absolute;
      top: 12px;
      left: 15px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 5px 12px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      z-index: 1000;
      transition: background 0.2s;
    }
    .menu-toggle-btn:hover { background: rgba(255, 255, 255, 0.4); }

    .side-menu {
      position: absolute;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: rgba(10, 15, 30, 0.95);
      border-right: 2px solid #0052cc;
      z-index: 1001;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: left 0.3s ease;
      box-shadow: 5px 0 15px rgba(0,0,0,0.5);
      overflow-y: auto;
    }
    .side-menu.open { left: 0; }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .menu-title { font-size: 1.2rem; font-weight: bold; color: #00ffcc; }
    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .menu-group { display: flex; flex-direction: column; gap: 8px; }
    .menu-group-title { font-size: 0.85rem; color: #888; text-transform: uppercase; }
    .menu-btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px;
      text-align: left;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .menu-btn:hover { background: #0052cc; border-color: #3b82f6; }
    .menu-btn.active { background: #0052cc; border-color: #60a5fa; }

    /* ==========================================
       メインレイアウト & テーマ設定
       ========================================== */
    .header {
      background-color: #000;
      padding: 0.8rem 2.5rem 0.8rem 6rem; /* ボタン用の左余白 */
      display: flex;
      align-items: baseline;
      gap: 15px;
    }
    .header-title-jp { font-size: 2.8rem; font-weight: bold; letter-spacing: 2px; }
    .header-title-en { font-size: 1.6rem; font-weight: bold; color: #e2e8f0; }

    .main-body {
      flex: 1;
      background-color: #0052cc; /* デフォルト：ブルー */
      padding: 1.5rem 2.5rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 15px 20px;
      align-items: center;
      transition: background-color 0.3s;
    }

    /* テーマ定義 */
    .theme-red { background-color: #b91c1c !important; }
    .theme-dark { background-color: #111827 !important; }
    .theme-green { background-color: #065f46 !important; }

    .label-box { display: flex; flex-direction: column; }
    .label-jp { font-size: 2.2rem; font-weight: bold; line-height: 1.1; }
    .label-en { font-size: 1.2rem; color: #cbd5e1; }

    .current-value-panel {
      background-color: #103380;
      border: 2px solid #002266;
      border-radius: 4px;
      padding: 0.2rem 1.5rem;
      text-align: right;
      transition: background-color 0.1s ease, color 0.1s ease;
    }
    .time-text {
      font-size: 5.5rem;
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: -2px;
    }

    /* 点滅フラッシュ */
    .current-value-panel.flash-active {
      background-color: #ffffff !important;
      border: 4px solid #002b80;
    }
    .current-value-panel.flash-active .time-text {
      color: #00247d !important;
    }

    .change-value-panel {
      background-color: #ff3333;
      border: 2px solid #b30000;
      border-radius: 4px;
      padding: 0.5rem 1.5rem;
      text-align: right;
    }
    .change-text {
      font-size: 3.2rem;
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
    }

    .details-container {
      grid-column: 1 / 3;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
    }
    .detail-value {
      font-size: 3rem;
      font-weight: bold;
      text-align: right;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }

    .footer-line { height: 8px; background-color: #cc0000; }
  </style>
</head>
<body>

  <div class="screen-container">
    <!-- メニュー開閉ボタン -->
    <button class="menu-toggle-btn" onclick="toggleMenu()">☰ MENU</button>

    <!-- サイドメニューパネル -->
    <div class="side-menu" id="side-menu">
      <div class="menu-header">
        <span class="menu-title">SETTINGS & MODES</span>
        <button class="close-btn" onclick="toggleMenu()">×</button>
      </div>

      <!-- 表示モード切替 -->
      <div class="menu-group">
        <span class="menu-group-title">表示モード</span>
        <button class="menu-btn active" onclick="setMode('nikkei')">日経平均株価 モード</button>
        <button class="menu-btn" onclick="setMode('topix')">TOPIX モード</button>
        <button class="menu-btn" onclick="setMode('usdjpy')">ドル/円 為替モード</button>
        <button class="menu-btn" onclick="setMode('dow')">NYダウ モード</button>
      </div>

      <!-- カラーテーマ切替 -->
      <div class="menu-group">
        <span class="menu-group-title">カラーテーマ</span>
        <button class="menu-btn" onclick="setTheme('blue')">ANNブルー (標準)</button>
        <button class="menu-btn" onclick="setTheme('red')">ニュースRED</button>
        <button class="menu-btn" onclick="setTheme('dark')">ナイトブラック</button>
        <button class="menu-btn" onclick="setTheme('green')">サイバーグリーン</button>
      </div>

      <!-- エフェクト設定 -->
      <div class="menu-group">
        <span class="menu-group-title">演出設定</span>
        <button class="menu-btn" id="flash-toggle-btn" onclick="toggleFlashSetting()">点滅エフェクト: ON</button>
        <button class="menu-btn" onclick="toggleFullScreen()">全画面表示 (F11)</button>
      </div>
    </div>

    <!-- 防災情報テロップ -->
    <div class="alert-bar" id="alert-bar">
      <span class="alert-title" id="alert-title">【緊急地震速報】</span>
      <span class="alert-text" id="alert-text">---</span>
    </div>

    <!-- ヘッダー -->
    <div class="header">
      <span class="header-title-jp" id="title-jp">日経平均株価</span>
      <span class="header-title-en" id="title-en">Nikkei 225</span>
    </div>

    <!-- メインボディ -->
    <div class="main-body" id="main-body">
      <div class="label-box">
        <span class="label-jp">現在値</span>
        <span class="label-en">Current</span>
      </div>
      <div class="current-value-panel" id="current-panel">
        <span class="time-text" id="clock-display">00:00:00</span>
      </div>

      <div class="label-box">
        <span class="label-jp">前日比</span>
        <span class="label-en">Change</span>
      </div>
      <div class="change-value-panel">
        <span class="change-text" id="date-display">+0.00</span>
      </div>

      <div class="details-container">
        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">始値</span>
            <span class="label-en">Open</span>
          </div>
          <div class="detail-value" id="open-display">2026.07.24</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">高値</span>
            <span class="label-en">High</span>
          </div>
          <div class="detail-value" id="high-display">FRIDAY</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">安値</span>
            <span class="label-en">Low</span>
          </div>
          <div class="detail-value" id="low-display">JST (UTC+9)</div>
        </div>
      </div>
    </div>

    <div class="footer-line"></div>
  </div>

  <script>
    let isFlashing = false;
    let allowFlash = true; // 点滅機能のON/OFF
    let alertTimer = null;
    let currentMode = 'nikkei';

    // モード設定定義
    const modeConfigs = {
      nikkei: { jp: "日経平均株価", en: "Nikkei 225", prefix: "+" },
      topix:  { jp: "TOPIX", en: "Tokyo Stock Price Index", prefix: "+" },
      usdjpy: { jp: "外国為替", en: "USD / JPY", prefix: "¥" },
      dow:    { jp: "NYダウ", en: "Dow Jones Industrial Average", prefix: "+" }
    };

    // ==========================================
    // 1. メイン時計・表示更新
    // ==========================================
    function updateClock() {
      const now = new Date();
      const hours   = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const year  = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date  = String(now.getDate()).padStart(2, '0');
      const weekdays = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

      // 時刻表示
      document.getElementById('clock-display').innerText = `${hours}:${minutes}:${seconds}`;
      
      // 前日比ダイナミック演出
      const config = modeConfigs[currentMode];
      const mockChange = (Math.sin(now.getTime() / 1000) * 12 + 105).toFixed(2);
      document.getElementById('date-display').innerText = `${config.prefix}${mockChange}`;

      // 日付・曜日等
      document.getElementById('open-display').innerText = `${year}.${month}.${date}`;
      document.getElementById('high-display').innerText = weekdays[now.getDay()];
      document.getElementById('low-display').innerText = "JST (UTC+9)";
    }

    // ==========================================
    // 2. メニュー & モード制御
    // ==========================================
    function toggleMenu() {
      document.getElementById('side-menu').classList.toggle('open');
    }

    function setMode(mode) {
      currentMode = mode;
      const config = modeConfigs[mode];
      document.getElementById('title-jp').innerText = config.jp;
      document.getElementById('title-en').innerText = config.en;

      // ボタンのActive表示切替
      document.querySelectorAll('.menu-group:nth-child(2) .menu-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      updateClock();
    }

    function setTheme(theme) {
      const mainBody = document.getElementById('main-body');
      mainBody.className = "main-body"; // リセット

      if (theme === 'red') mainBody.classList.add('theme-red');
      if (theme === 'dark') mainBody.classList.add('theme-dark');
      if (theme === 'green') mainBody.classList.add('theme-green');
    }

    function toggleFlashSetting() {
      allowFlash = !allowFlash;
      document.getElementById('flash-toggle-btn').innerText = `点滅エフェクト: ${allowFlash ? 'ON' : 'OFF'}`;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // ==========================================
    // 3. ランダム白フラッシュ（10秒に約3回）
    // ==========================================
    function checkRandomFlash() {
      if (!allowFlash || isFlashing) return;

      if (Math.random() < 0.3) {
        isFlashing = true;
        const panel = document.getElementById('current-panel');
        panel.classList.add('flash-active');

        const flashDuration = Math.floor(Math.random() * 500) + 500;
        setTimeout(() => {
          panel.classList.remove('flash-active');
          isFlashing = false;
        }, flashDuration);
      }
    }

    // ==========================================
    // 4. 防災情報API連携（自動監視）
    // ==========================================
    function showAlert(title, text, styleClass) {
      const bar = document.getElementById('alert-bar');
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-text').innerText = text;

      bar.className = "alert-bar " + styleClass;
      bar.style.display = "block";

      // 最終報から50秒後に自動削除
      if (alertTimer) clearTimeout(alertTimer);
      alertTimer = setTimeout(() => {
        bar.style.display = "none";
      }, 50000);
    }

    async function checkRealDisasterAPI() {
      try {
        const res = await fetch('https://api.p2pquake.net/v2/history?codes=551,552,554&limit=1');
        const data = await res.json();
        if (!data || data.length === 0) return;

        const info = data[0];

        // 1. 緊急地震速報 (code 551)
        if (info.code === 551 && info.earthquake && info.earthquake.hypocenter) {
          const area = info.earthquake.hypocenter.name || "不明";
          const maxScaleNum = info.earthquake.maxScale ? (info.earthquake.maxScale / 10) : 0;
          
          if (maxScaleNum >= 4.5) { // 震度5弱以上 ➔ 警報（赤）
            showAlert("【緊急地震速報（警報）】", `震源地：${area} / 予想最大震度：5弱以上 強い揺れに警戒`, "eew-alert");
          } else { // 震度1〜4 ➔ 予報（黄）
            showAlert("【緊急地震速報（予報）】", `震源地：${area} / 予想最大震度：${maxScaleNum || '1〜4'}`, "eew-warning");
          }
        }
        
        // 2. 震度情報 (code 552 / 震度3以上)
        else if (info.code === 552 && info.earthquake && info.earthquake.maxScale >= 30) {
          const area = info.earthquake.hypocenter.name || "各地";
          const scaleStr = info.earthquake.maxScale / 10;
          showAlert("【震度情報】", `最大震度${scaleStr}を観測（震源：${area}）`, "seismic-info");
        }

        // 3. 津波情報 (code 554)
        else if (info.code === 554) {
          showAlert("【津波情報】", "海岸付近の方はただちに高台へ避難してください", "tsunami-info");
        }
      } catch (e) {}
    }

    // 定期実行処理
    setInterval(updateClock, 1000);
    setInterval(checkRandomFlash, 1000);
    setInterval(checkRealDisasterAPI, 3000);

    updateClock();
  </script>
</body>
</html>
