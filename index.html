<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日経平均株価風 デジタルクロック</title>
  <style>
    /* ==========================================
       全体レイアウト
       ========================================== */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #000;
      font-family: 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', 'メイリオ', sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .screen-container {
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ==========================================
       1. ヘッダー（黒領域）
       ========================================== */
    .header {
      background-color: #000;
      padding: 0.8rem 2.5rem;
      display: flex;
      align-items: baseline;
      gap: 15px;
    }
    .header-title-jp {
      font-size: 2.8rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .header-title-en {
      font-size: 1.6rem;
      font-weight: bold;
      color: #e2e8f0;
    }

    /* ==========================================
       2. メインボディ（青領域）
       ========================================== */
    .main-body {
      flex: 1;
      background-color: #0052cc;
      padding: 1.5rem 2.5rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 15px 20px;
      align-items: center;
    }

    /* 左側の見出しラベル */
    .label-box {
      display: flex;
      flex-direction: column;
    }
    .label-jp {
      font-size: 2.2rem;
      font-weight: bold;
      line-height: 1.1;
    }
    .label-en {
      font-size: 1.2rem;
      color: #cbd5e1;
    }

    /* --- 2a. 現在値パネル ---
       通常時（image_2.jpg）：濃い青背景 ＋ 白文字
    ------------------------------------------- */
    .current-value-panel {
      background-color: #103380; /* 通常時の濃い青 */
      border: 2px solid #002266;
      border-radius: 4px;
      padding: 0.2rem 1.5rem;
      text-align: right;
      transition: background-color 0.1s ease, color 0.1s ease;
    }
    .time-text {
      font-size: 5.5rem;
      font-weight: bold;
      color: #ffffff; /* 通常時は白文字 */
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: -2px;
    }

    /* --- フラッシュ時（image_3.jpg）：白背景 ＋ 青文字 --- */
    .current-value-panel.flash-active {
      background-color: #ffffff !important; /* 白背景 */
      border: 4px solid #002b80;
    }
    .current-value-panel.flash-active .time-text {
      color: #00247d !important; /* 青文字 */
    }

    /* --- 2b. 前日比（赤いパネル） --- */
    .change-value-panel {
      background-color: #ff3333;
      border: 2px solid #b30000;
      border-radius: 4px;
      padding: 0.5rem 1.5rem;
      text-align: right;
    }
    .change-text {
      font-size: 3.2rem;
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
    }

    /* --- 2c. 詳細情報リスト --- */
    .details-container {
      grid-column: 1 / 3;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
    }
    .detail-value {
      font-size: 3rem;
      font-weight: bold;
      text-align: right;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }

    /* 下部の赤ライン */
    .footer-line {
      height: 8px;
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <div class="screen-container">
    <!-- 1. ヘッダー -->
    <div class="header">
      <span class="header-title-jp">日経平均株価</span>
      <span class="header-title-en">Nikkei 225</span>
    </div>

    <!-- 2. メイン画面 -->
    <div class="main-body">
      
      <!-- 現在値（時刻） -->
      <div class="label-box">
        <span class="label-jp">現在値</span>
        <span class="label-en">Current</span>
      </div>
      <div class="current-value-panel" id="current-panel">
        <span class="time-text" id="clock-display">16:11:00</span>
      </div>

      <!-- 前日比（日付・曜日など） -->
      <div class="label-box">
        <span class="label-jp">前日比</span>
        <span class="label-en">Change</span>
      </div>
      <div class="change-value-panel">
        <span class="change-text" id="date-display">+2026.07.24</span>
      </div>

      <!-- 始値・高値・安値 相当の情報 -->
      <div class="details-container">
        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">始値</span>
            <span class="label-en">Open</span>
          </div>
          <div class="detail-value" id="open-display">2026.07.24</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">高値</span>
            <span class="label-en">High</span>
          </div>
          <div class="detail-value" id="high-display">FRIDAY</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">安値</span>
            <span class="label-en">Low</span>
          </div>
          <div class="detail-value" id="low-display">JST (UTC+9)</div>
        </div>
      </div>

    </div>

    <!-- 赤いフッターバー -->
    <div class="footer-line"></div>
  </div>

  <script>
    let isFlashing = false; // 点滅中かどうかのフラグ

    function updateClock() {
      const now = new Date();
      
      const hours   = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const clockDisplay = document.getElementById('clock-display');
      clockDisplay.innerText = `${hours}:${minutes}:${seconds}`;

      // 日付等の設定
      const year  = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date  = String(now.getDate()).padStart(2, '0');
      const weekdays = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      
      document.getElementById('date-display').innerText = `+${month}.${date}`;
      document.getElementById('open-display').innerText = `${year}.${month}.${date}`;
      document.getElementById('high-display').innerText = weekdays[now.getDay()];
    }

    // ==========================================
    // 10秒間に約3回の確率でランダム点滅させる制御
    // ==========================================
    function checkRandomFlash() {
      // すでに点滅中なら二重に発火させない
      if (isFlashing) return;

      // 1秒間に30%の確率（10秒で平均3回発生）
      const chance = Math.random();
      if (chance < 0.3) {
        triggerFlash();
      }
    }

    function triggerFlash() {
      isFlashing = true;
      const panel = document.getElementById('current-panel');

      // 白背景＋青文字にするクラスを付与
      panel.classList.add('flash-active');

      // 0.5秒〜1.0秒（500ms〜1000ms）のランダムな時間を計算
      const flashDuration = Math.floor(Math.random() * 500) + 500;

      // 指定時間後に元のデザインに戻す
      setTimeout(() => {
        panel.classList.remove('flash-active');
        isFlashing = false;
      }, flashDuration);
    }

    // 時計の更新（1秒ごと）
    setInterval(updateClock, 1000);
    updateClock();

    // ランダム点滅の判定（1秒ごと）
    setInterval(checkRandomFlash, 1000);
  </script>
</body>
</html>
