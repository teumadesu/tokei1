<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOCKVOICE 風デジタルクロック</title>
  <style>
    /* ==========================================
       全体・レイアウトの設定（ベース：image_0.png）
       ========================================== */
    body {
      margin: 0;
      background-color: #000; /* テレビ画面の外側をイメージ */
      font-family: 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', 'BIZ UDMincho', sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* メインの画面コンテナ */
    .screen-container {
      width: 90vw; /* 画面幅 */
      height: (16 / 9) * 90vw; /* アスペクト比16:9を維持 */
      max-width: 1280px; /* PC用最大幅 */
      max-height: 720px;  /* PC用最大高さ */
      background-color: #000;
      border: 4px solid #333; /* 画面のベゼル */
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ==========================================
       1. 上部ヘッダー（黒い部分）
       ========================================== */
    .header {
      background-color: #000;
      color: #ccc;
      padding: 0.5rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-bottom: 2px solid #333;
      display: flex;
      align-items: center;
    }
    .header-logo {
      font-size: 0.8rem;
      margin-right: 2rem;
      color: #888;
    }
    .header-title-en {
      font-weight: normal;
      font-size: 1rem;
      margin-left: 1rem;
    }

    /* ==========================================
       2. メインボディ（青い部分）
       ========================================== */
    .main-body {
      flex: 1;
      background-color: #0033cc; /* 元画像の美しい青 */
      display: grid;
      grid-template-rows: 2.5fr 1fr 3fr; /* 縦の分割比 */
      grid-template-columns: 1fr 1fr;   /* 横の分割 */
      gap: 0;
      position: relative;
    }

    /* 共通のセクションスタイル */
    .section {
      border: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    .label-jp { font-size: 1.8rem; font-weight: bold; line-height: 1.2; }
    .label-en { font-size: 1rem; color: #b3b3b3; line-height: 1; }
    .value { font-family: monospace; }

    /* --- 2a. 「現在時刻」セクション（一番大きい） --- */
    #section-time {
      grid-column: 1 / 3; /* 2列全体を使用 */
      grid-row: 1;
    }
    #time-value {
      font-size: 8rem; /* 特大 */
      text-align: right;
      color: #fff;
    }

    /* --- 2b. 「秒」セクション（元の前日比） --- */
    #section-seconds {
      grid-column: 1;
      grid-row: 2;
    }
    #seconds-value {
      font-size: 4rem;
      text-align: right;
      color: #ff9900; /* 元画像のオレンジっぽい赤 */
    }

    /* --- 2c. 右側の空白部分 --- */
    .section-empty {
      grid-column: 2;
      grid-row: 2;
      border: 1px solid #1a1a1a;
    }

    /* --- 2d. 詳細情報セクション（左下） --- */
    #section-details {
      grid-column: 1 / 3; /* 2列全体を使用 */
      grid-row: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 2rem;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .detail-label-jp { font-size: 1.5rem; color: #fff; font-weight: bold; width: 10rem; }
    .detail-label-en { font-size: 0.9rem; color: #888; width: 10rem; }
    .detail-value { font-size: 2.2rem; color: #fff; font-family: monospace; }

    /* ==========================================
       3. フッター（赤い線）
       ========================================== */
    .footer {
      height: 10px;
      background-color: #cc0000; /* 元画像の赤い線 */
    }

    /* ==========================================
       レスポンシブ対応
       ========================================== */
    @media (max-width: 600px) {
      .label-jp { font-size: 1.2rem; }
      .label-en { font-size: 0.8rem; }
      #time-value { font-size: 4rem; }
      #seconds-value { font-size: 2rem; }
      .detail-label-jp { font-size: 1rem; width: 6rem; }
      .detail-label-en { font-size: 0.7rem; width: 6rem; }
      .detail-value { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="screen-container">
    <!-- 1. ヘッダー（黒） -->
    <div class="header">
      <span class="header-logo">SYSTEMWIDE</span>
      <span class="header-title-jp">現在時刻</span>
      <span class="header-title-en">TIMEZONE JST</span>
    </div>

    <!-- 2. メインボディ（青） -->
    <div class="main-body">
      <!-- 時:分 -->
      <div class="section" id="section-time">
        <div class="label-jp">現在時刻</div>
        <div class="label-en">Current</div>
        <div class="value" id="time-value">12:34</div>
      </div>

      <!-- 秒 -->
      <div class="section" id="section-seconds">
        <div class="label-jp">秒</div>
        <div class="label-en">Seconds</div>
        <div class="value" id="seconds-value">12</div>
      </div>

      <div class="section-empty"></div>

      <!-- 詳細情報（左下） -->
      <div class="section" id="section-details">
        <!-- 日付 -->
        <div class="detail-item">
          <div>
            <div class="detail-label-jp">日付</div>
            <div class="detail-label-en">Date</div>
          </div>
          <div class="detail-value" id="date-value">2026.07.24</div>
        </div>
        <!-- 曜日 -->
        <div class="detail-item">
          <div>
            <div class="detail-label-jp">曜日</div>
            <div class="detail-label-en">Weekday</div>
          </div>
          <div class="detail-value" id="weekday-value">FRI</div>
        </div>
        <!-- (おまけ)日本の祝日 -->
        <div class="detail-item">
          <div>
            <div class="detail-label-jp">日本の祝日</div>
            <div class="detail-label-en">National Holiday</div>
          </div>
          <div class="detail-value" id="holiday-value">スポーツの日</div>
        </div>
      </div>

    </div>

    <!-- 3. フッター（赤） -->
    <div class="footer"></div>
  </div>

  <script>
    // ==========================================
    // 時計を更新するプログラム
    // ==========================================
    function updateClock() {
      const now = new Date();
      
      // 1. 時:分
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time-value').innerText = `${hours}:${minutes}`;

      // 2. 秒
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('seconds-value').innerText = seconds;

      // 3. 日付
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      document.getElementById('date-value').innerText = `${year}.${month}.${date}`;

      // 4. 曜日
      const weekdaysEn = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      document.getElementById('weekday-value').innerText = weekdaysEn[now.getDay()];

      // 5. (おまけ)日本の祝日の判定処理
      // (今回はサンプルとして固定値を表示します。自分で機能を追加するポイントです)
    }

    // 1秒ごとに updateClock を実行
    setInterval(updateClock, 1000);
    // ページ開いた瞬間に一回実行
    updateClock();
  </script>
</body>
</html>
