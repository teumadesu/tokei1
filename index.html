<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日経平均株価風 デジタルクロック & リアルタイムニュース</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #000;
      font-family: 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', 'メイリオ', sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .screen-container {
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ==========================================
       防災情報テロップ（色を動的に変更）
       ========================================== */
    .alert-bar {
      display: none;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border-bottom: 4px solid rgba(255, 255, 255, 0.4);
      z-index: 999;
      transition: background-color 0.3s, color 0.3s;
    }
    .alert-title { font-size: 1.8rem; }
    .alert-text { font-size: 1.4rem; margin-left: 15px; }

    /* 各種カラー設定 */
    /* 1. EEW 予報 (震度1〜4)：黄色 */
    .alert-bar.eew-warning {
      background-color: #ffd700;
      color: #000;
    }
    /* 2. EEW 警報 (震度5弱〜7)：赤色 */
    .alert-bar.eew-alert {
      background-color: #d32f2f;
      color: #fff;
      animation: blink-red 1s infinite alternate;
    }
    /* 3. 震度情報 (震度3以上)：青色 */
    .alert-bar.seismic-info {
      background-color: #0055ff;
      color: #fff;
    }
    /* 4. 津波情報：オレンジ色 */
    .alert-bar.tsunami-info {
      background-color: #ff6600;
      color: #fff;
    }

    @keyframes blink-red {
      0% { background-color: #d32f2f; }
      100% { background-color: #990000; }
    }

    /* モード切り替え通知 */
    .mode-notify {
      position: absolute;
      top: 15px;
      right: 25px;
      background: rgba(0, 255, 204, 0.9);
      color: #000;
      padding: 5px 15px;
      font-weight: bold;
      border-radius: 4px;
      display: none;
      z-index: 100;
    }

    /* 訓練用テストボタンパネル（画面右下） */
    .test-panel {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 5px;
      z-index: 1000;
    }
    .test-btn {
      background: #222;
      color: #ccc;
      border: 1px solid #555;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 3px;
      opacity: 0.5;
    }
    .test-btn:hover { opacity: 1; background: #444; color: #fff; }

    /* ヘッダー */
    .header {
      background-color: #000;
      padding: 0.8rem 2.5rem;
      display: flex;
      align-items: baseline;
      gap: 15px;
    }
    .header-title-jp { font-size: 2.8rem; font-weight: bold; letter-spacing: 2px; }
    .header-title-en { font-size: 1.6rem; font-weight: bold; color: #e2e8f0; }

    /* メインボディ */
    .main-body {
      flex: 1;
      background-color: #0052cc;
      padding: 1.5rem 2.5rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 15px 20px;
      align-items: center;
    }

    .label-box { display: flex; flex-direction: column; }
    .label-jp { font-size: 2.2rem; font-weight: bold; line-height: 1.1; }
    .label-en { font-size: 1.2rem; color: #cbd5e1; }

    /* 現在値パネル */
    .current-value-panel {
      background-color: #103380;
      border: 2px solid #002266;
      border-radius: 4px;
      padding: 0.2rem 1.5rem;
      text-align: right;
      transition: background-color 0.1s ease, color 0.1s ease;
    }
    .time-text {
      font-size: 5.5rem;
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: -2px;
    }

    .current-value-panel.flash-active {
      background-color: #ffffff !important;
      border: 4px solid #002b80;
    }
    .current-value-panel.flash-active .time-text {
      color: #00247d !important;
    }

    /* 前日比パネル */
    .change-value-panel {
      background-color: #ff3333;
      border: 2px solid #b30000;
      border-radius: 4px;
      padding: 0.5rem 1.5rem;
      text-align: right;
    }
    .change-text {
      font-size: 3.2rem;
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
    }

    /* 詳細情報 */
    .details-container {
      grid-column: 1 / 3;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
    }
    .detail-value {
      font-size: 3rem;
      font-weight: bold;
      text-align: right;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }

    #low-trigger-row {
      cursor: pointer;
      user-select: none;
    }

    .footer-line { height: 8px; background-color: #cc0000; }
  </style>
</head>
<body>

  <div class="screen-container">
    <!-- 防災情報テロップエリア -->
    <div class="alert-bar" id="alert-bar">
      <span class="alert-title" id="alert-title">【緊急地震速報】</span>
      <span class="alert-text" id="alert-text">情報を受信中...</span>
    </div>

    <!-- モード切り替え通知 -->
    <div class="mode-notify" id="mode-notify">MODE CHANGED</div>

    <!-- ヘッダー -->
    <div class="header">
      <span class="header-title-jp">日経平均株価</span>
      <span class="header-title-en">Nikkei 225</span>
    </div>

    <!-- メインボディ -->
    <div class="main-body">
      <!-- 現在値 -->
      <div class="label-box">
        <span class="label-jp">現在値</span>
        <span class="label-en">Current</span>
      </div>
      <div class="current-value-panel" id="current-panel">
        <span class="time-text" id="clock-display">16:11:00</span>
      </div>

      <!-- 前日比 -->
      <div class="label-box">
        <span class="label-jp">前日比</span>
        <span class="label-en">Change</span>
      </div>
      <div class="change-value-panel">
        <span class="change-text" id="date-display">+12.34</span>
      </div>

      <!-- 詳細情報 -->
      <div class="details-container">
        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">始値</span>
            <span class="label-en">Open</span>
          </div>
          <div class="detail-value" id="open-display">2026.07.24</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">高値</span>
            <span class="label-en">High</span>
          </div>
          <div class="detail-value" id="high-display">FRIDAY</div>
        </div>

        <div class="detail-row" id="low-trigger-row" onclick="toggleStockMode()">
          <div class="label-box">
            <span class="label-jp">安値</span>
            <span class="label-en" id="low-label-en">Low (タップで本物切替)</span>
          </div>
          <div class="detail-value" id="low-display">JST (UTC+9)</div>
        </div>
      </div>
    </div>

    <div class="footer-line"></div>

    <!-- 各種動作確認用ボタン -->
    <div class="test-panel">
      <button class="test-btn" onclick="testEEW(3)">[テスト] EEW黄(震度3)</button>
      <button class="test-btn" onclick="testEEW(5)">[テスト] EEW赤(震度5弱)</button>
      <button class="test-btn" onclick="testShindo()">[テスト] 震度青(震度4)</button>
      <button class="test-btn" onclick="testTsunami()">[テスト] 津波橙</button>
    </div>
  </div>

  <script>
    let isFlashing = false;
    let isRealStockMode = false;
    let alertTimer = null;

    let realData = { price: "---", change: "---", open: "---", high: "---", low: "---" };

    // ==========================================
    // 1. メイン時計・表示更新
    // ==========================================
    function updateDisplay() {
      const now = new Date();
      const hours   = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const year  = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date  = String(now.getDate()).padStart(2, '0');
      const weekdays = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

      if (!isRealStockMode) {
        document.getElementById('clock-display').innerText = `${hours}:${minutes}:${seconds}`;
        
        const mockChange = (Math.sin(now.getTime() / 1000) * 15 + 120).toFixed(2);
        document.getElementById('date-display').innerText = `+${mockChange}`;

        document.getElementById('open-display').innerText = `${year}.${month}.${date}`;
        document.getElementById('high-display').innerText = weekdays[now.getDay()];
        document.getElementById('low-display').innerText = "JST (UTC+9)";
      } else {
        document.getElementById('clock-display').innerText = realData.price;
        document.getElementById('date-display').innerText = realData.change;
        document.getElementById('open-display').innerText = realData.open;
        document.getElementById('high-display').innerText = realData.high;
        document.getElementById('low-display').innerText = realData.low;
      }
    }

    // ==========================================
    // 2. 本物株価API取得処理
    // ==========================================
    async function fetchRealStockData() {
      try {
        const response = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/^N225');
        const data = await response.json();
        const meta = data.chart.result[0].meta;

        const currentPrice = meta.regularMarketPrice.toFixed(2);
        const prevClose = meta.chartPreviousClose;
        const diff = (currentPrice - prevClose).toFixed(2);

        realData.price = currentPrice;
        realData.change = (diff >= 0 ? `+${diff}` : `${diff}`);
        realData.open = meta.regularMarketDayLow ? meta.regularMarketDayLow.toFixed(2) : "38700.10";
        realData.high = meta.regularMarketDayHigh ? meta.regularMarketDayHigh.toFixed(2) : "39010.22";
        realData.low = meta.regularMarketDayLow ? meta.regularMarketDayLow.toFixed(2) : "38650.00";
      } catch (err) {
        realData = { price: "38920.50", change: "+245.10", open: "38700.10", high: "39010.22", low: "38650.00" };
      }
    }

    function toggleStockMode() {
      isRealStockMode = !isRealStockMode;
      
      const notify = document.getElementById('mode-notify');
      notify.innerText = isRealStockMode ? "REAL STOCK DATA MODE" : "CLOCK MODE";
      notify.style.display = "block";
      setTimeout(() => { notify.style.display = "none"; }, 2000);

      if (isRealStockMode) {
        fetchRealStockData();
      }
      updateDisplay();
    }

    setTimeout(() => {
      document.getElementById('low-label-en').innerText = "Low";
    }, 5000);

    // ==========================================
    // 3. ランダム白フラッシュ（10秒に約3回）
    // ==========================================
    function checkRandomFlash() {
      if (isFlashing) return;

      if (Math.random() < 0.3) {
        isFlashing = true;
        const panel = document.getElementById('current-panel');
        panel.classList.add('flash-active');

        const flashDuration = Math.floor(Math.random() * 500) + 500;
        setTimeout(() => {
          panel.classList.remove('flash-active');
          isFlashing = false;
        }, flashDuration);
      }
    }

    // ==========================================
    // 4. テロップ表示・制御共通処理（50秒後消去）
    // ==========================================
    function showAlert(title, text, styleClass) {
      const bar = document.getElementById('alert-bar');
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-text').innerText = text;

      // クラスを一度リセットして目的のスタイルを設定
      bar.className = "alert-bar " + styleClass;
      bar.style.display = "block";

      // 50秒後（50000ms）に自動削除
      if (alertTimer) clearTimeout(alertTimer);
      alertTimer = setTimeout(() => {
        bar.style.display = "none";
      }, 50000);
    }

    // --- テスト用関数 ---
    function testEEW(scale) {
      if (scale < 5) {
        showAlert("【緊急地震速報（予報）】", "千葉県沖で地震 予想最大震度：3", "eew-warning");
      } else {
        showAlert("【緊急地震速報（警報）】", "茨城県沖で地震 予想最大震度：5弱 強い揺れに警戒", "eew-alert");
      }
    }

    function testShindo() {
      showAlert("【震度情報】", "最大震度4を観測した地震が発生しました（震源：日向灘）", "seismic-info");
    }

    function testTsunami() {
      showAlert("【津波注意報】", "太平洋沿岸に津波注意報が発表されました 海海岸から離れてください", "tsunami-info");
    }

    // ==========================================
    // 5. リアルタイム防災APIの自動受信・振り分け
    // ==========================================
    async function checkRealDisasterAPI() {
      try {
        // P2P地震情報API
        const res = await fetch('https://api.p2pquake.net/v2/history?codes=551,552,554&limit=1');
        const data = await res.json();
        if (!data || data.length === 0) return;

        const info = data[0];

        // 1. 緊急地震速報 (code 551)
        if (info.code === 551 && info.earthquake && info.earthquake.hypocenter) {
          const area = info.earthquake.hypocenter.name || "不明";
          const maxScaleNum = info.earthquake.maxScale ? (info.earthquake.maxScale / 10) : 0;
          
          if (maxScaleNum >= 4.5) { // 5弱以上 ➔ 警報（赤）
            showAlert("【緊急地震速報（警報）】", `震源地：${area} / 予想最大震度：5弱以上`, "eew-alert");
          } else { // 1〜4 ➔ 予報（黄）
            showAlert("【緊急地震速報（予報）】", `震源地：${area} / 予想最大震度：${maxScaleNum || '1〜4'}`, "eew-warning");
          }
        }
        
        // 2. 震度情報 (code 552 / 震度3以上)
        else if (info.code === 552 && info.earthquake && info.earthquake.maxScale >= 30) {
          const area = info.earthquake.hypocenter.name || "各地";
          const scaleStr = info.earthquake.maxScale / 10;
          showAlert("【震度情報】", `最大震度${scaleStr}を観測（震源：${area}）`, "seismic-info");
        }

        // 3. 津波情報 (code 554)
        else if (info.code === 554) {
          showAlert("【津波情報】", "海岸付近の方はただちに高台へ避難してください", "tsunami-info");
        }
      } catch (e) {}
    }

    // 定期実行処理
    setInterval(updateDisplay, 1000);
    setInterval(checkRandomFlash, 1000);
    setInterval(checkRealDisasterAPI, 3000);
    setInterval(fetchRealStockData, 30000);

    updateDisplay();
  </script>
</body>
</html>
