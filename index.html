<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>株式市場みたいな時計 (メニュー・スクロール修正版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #000000;
      font-family: 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', 'メイリオ', sans-serif;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* CRTレトロ走査線オーバーレイ */
    .scanlines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 800;
      pointer-events: none;
      display: none;
    }

    .screen-container {
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      transition: all 0.3s ease;
    }

    /* 防災情報テロップ */
    .alert-bar {
      display: none;
      padding: 0.6rem 1rem;
      font-weight: bold;
      border-bottom: 4px solid rgba(255, 255, 255, 0.4);
      z-index: 900;
      word-break: break-all;
    }
    .alert-title { font-size: clamp(1rem, 3vw, 1.8rem); }
    .alert-text { font-size: clamp(0.9rem, 2.5vw, 1.4rem); margin-left: 10px; }

    .alert-bar.eew-warning { background-color: #ffd700; color: #000000; }
    .alert-bar.eew-alert {
      background-color: #d32f2f;
      color: #ffffff;
      animation: blink-red 1s infinite alternate;
    }
    .alert-bar.seismic-info { background-color: #0055ff; color: #ffffff; }
    .alert-bar.tsunami-info { background-color: #ff6600; color: #ffffff; }

    @keyframes blink-red {
      0% { background-color: #d32f2f; }
      100% { background-color: #880000; }
    }

    /* メニューボタン */
    .menu-toggle-btn {
      position: absolute;
      top: 12px;
      left: 15px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      z-index: 1000;
    }
    .menu-toggle-btn:hover { background: rgba(255, 255, 255, 0.4); }

    /* サイドメニュー（スクロールを大幅強化） */
    .side-menu {
      position: absolute;
      top: 0;
      left: -100%;
      width: min(380px, 85vw);
      height: 100%;
      background: rgba(8, 12, 20, 0.98);
      border-right: 2px solid #0052cc;
      z-index: 1001;
      padding: 20px 15px 50px 15px; /* 最下部に十分な余白を設定 */
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 10px 0 30px rgba(0,0,0,0.9);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* スマホでのなめらかなスクロール */
    }
    .side-menu.open { left: 0; }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
      flex-shrink: 0; /* ヘッダーが潰れないように設定 */
    }
    .menu-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; }

    .menu-section-title {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-left: 3px solid #38bdf8;
      padding-left: 8px;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; }
    
    .menu-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 6px;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .menu-btn:hover { background: #0052cc; border-color: #3b82f6; color: #fff; }
    .menu-btn.active { background: #0052cc; border-color: #60a5fa; color: #fff; }

    /* メイン画面 */
    .header {
      background-color: #000000;
      padding: 0.8rem 1.5rem 0.8rem 6.5rem;
      display: flex;
      align-items: baseline;
      gap: 12px;
      overflow: hidden;
    }
    .header-title-jp { font-size: clamp(1.4rem, 4vw, 2.8rem); font-weight: bold; letter-spacing: 2px; color: #ffffff; white-space: nowrap; }
    .header-title-en { font-size: clamp(0.9rem, 2vw, 1.6rem); font-weight: bold; color: #cbd5e1; white-space: nowrap; }

    .header-title-jp.neon {
      text-shadow: 0 0 10px #38bdf8, 0 0 20px #38bdf8;
    }

    .main-body {
      flex: 1;
      background-color: #0052cc;
      padding: 1rem 1.5rem;
      display: grid;
      grid-template-columns: minmax(100px, 240px) 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 10px 15px;
      align-items: center;
      transition: background-color 0.3s ease;
      overflow: hidden;
    }

    /* テーマ定義 */
    .theme-red { background-color: #b91c1c !important; }
    .theme-dark { background-color: #0f172a !important; }
    .theme-green { background-color: #065f46 !important; }
    .theme-orange { background-color: #c2410c !important; }
    .theme-matrix { background-color: #022c22 !important; }
    .theme-retro { background-color: #3f3f46 !important; }
    .theme-alert { background-color: #7f1d1d !important; }

    .label-box { display: flex; flex-direction: column; justify-content: center; }
    .label-jp { font-size: clamp(1.2rem, 3.2vw, 2.2rem); font-weight: bold; line-height: 1.1; color: #ffffff; }
    .label-en { font-size: clamp(0.75rem, 1.8vw, 1.2rem); color: #cbd5e1; }

    .current-value-panel {
      background-color: #103380;
      border: 2px solid #002266;
      border-radius: 4px;
      padding: 0.2rem 1rem;
      text-align: right;
      overflow: hidden;
    }
    .time-text {
      font-size: clamp(2.2rem, 8vw, 5.5rem);
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    /* 点滅時 */
    .current-value-panel.flash-active {
      background-color: #ffffff !important;
    }
    .current-value-panel.flash-active .time-text {
      color: #00247d !important;
    }

    .change-value-panel {
      background-color: #ff3333;
      border: 2px solid #b30000;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      text-align: right;
      overflow: hidden;
    }
    .change-text {
      font-size: clamp(1.5rem, 5vw, 3.2rem);
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      white-space: nowrap;
    }

    .details-container {
      grid-column: 1 / 3;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 5px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: minmax(100px, 240px) 1fr;
      align-items: center;
    }
    .detail-value {
      font-size: clamp(1.4rem, 4.5vw, 3rem);
      font-weight: bold;
      text-align: right;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
      white-space: nowrap;
    }

    .footer-line { height: 8px; background-color: #cc0000; }

    /* モバイル・縦型レイアウト */
    @media (max-width: 768px) {
      .screen-container { max-width: 100vw; max-height: 100vh; }
      .main-body {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, auto);
        gap: 6px;
        padding: 0.8rem 1rem;
        overflow-y: auto;
      }
      .details-container { grid-column: 1 / 2; gap: 6px; }
      .detail-row { grid-template-columns: 100px 1fr; }
      .header { padding-left: 5.5rem; }
    }

    .screen-container.layout-vertical {
      max-width: 450px;
      max-height: 100vh;
      margin: 0 auto;
    }
    .screen-container.layout-vertical .header {
      padding-left: 5.5rem;
      flex-direction: column;
      gap: 0;
      align-items: flex-start;
    }
    .screen-container.layout-vertical .main-body {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(6, auto);
      gap: 6px;
      padding: 0.8rem 1rem;
    }
    .screen-container.layout-vertical .details-container {
      grid-column: 1 / 2;
    }
    .screen-container.layout-vertical .detail-row {
      grid-template-columns: 90px 1fr;
    }
    .screen-container.layout-vertical .time-text {
      font-size: clamp(2rem, 10vw, 3.8rem);
    }
    .screen-container.layout-vertical .change-text {
      font-size: clamp(1.5rem, 7vw, 2.5rem);
    }
    .screen-container.layout-vertical .detail-value {
      font-size: clamp(1.2rem, 5vw, 2rem);
    }
  </style>
</head>
<body>

  <div class="scanlines" id="scanlines"></div>

  <div class="screen-container" id="screen-container">
    <button class="menu-toggle-btn" onclick="toggleMenu()">メニュー</button>

    <div class="side-menu" id="side-menu">
      <div class="menu-header">
        <span class="menu-title">STUDIO CONTROL PANEL</span>
        <button class="close-btn" onclick="toggleMenu()">×</button>
      </div>

      <span class="menu-section-title">1. 市場・銘柄モード (全12種)</span>
      <div class="menu-grid">
        <button class="menu-btn active" onclick="setMode('nikkei', this)">日経平均株価</button>
        <button class="menu-btn" onclick="setMode('topix', this)">TOPIX</button>
        <button class="menu-btn" onclick="setMode('usdjpy', this)">ドル / 円</button>
        <button class="menu-btn" onclick="setMode('dow', this)">NYダウ</button>
        <button class="menu-btn" onclick="setMode('btc', this)">BTC / 円</button>
        <button class="menu-btn" onclick="setMode('eth', this)">ETH / 円</button>
        <button class="menu-btn" onclick="setMode('nasdaq', this)">NASDAQ</button>
        <button class="menu-btn" onclick="setMode('sp500', this)">S&P 500</button>
        <button class="menu-btn" onclick="setMode('gold', this)">金先物 (Gold)</button>
        <button class="menu-btn" onclick="setMode('oil', this)">原油 (WTI)</button>
        <button class="menu-btn" onclick="setMode('jgb', this)">日本10年国債</button>
        <button class="menu-btn" onclick="setMode('nkfutures', this)">日経225先物</button>
      </div>

      <span class="menu-section-title">2. テーマカラー (全8種)</span>
      <div class="menu-grid">
        <button class="menu-btn" onclick="setTheme('blue')">標準色</button>
        <button class="menu-btn" onclick="setTheme('red')">RED</button>
        <button class="menu-btn" onclick="setTheme('dark')">ブラック</button>
        <button class="menu-btn" onclick="setTheme('green')">グリーン</button>
        <button class="menu-btn" onclick="setTheme('orange')">サンセット</button>
        <button class="menu-btn" onclick="setTheme('matrix')">マトリックス</button>
        <button class="menu-btn" onclick="setTheme('retro')">レトロ</button>
        <button class="menu-btn" onclick="setTheme('alert')">緊急事態</button>
      </div>

      <span class="menu-section-title">3. タイムゾーン & 日付表示</span>
      <div class="menu-grid">
        <button class="menu-btn" onclick="setTimezone('JST', 'JST (UTC+9)')">JST (東京)</button>
        <button class="menu-btn" onclick="setTimezone('UTC', 'UTC (+0)')">UTC (協定時)</button>
        <button class="menu-btn" onclick="setTimezone('EST', 'EST (NY)')">EST (NY)</button>
        <button class="menu-btn" onclick="setTimezone('GMT', 'GMT (ロンドン)')">GMT (ロンドン)</button>
      </div>
      <div class="menu-grid">
        <button class="menu-btn" id="date-fmt-btn" onclick="rotateDateFormat()">日付形式: YYYY.MM.DD</button>
        <button class="menu-btn" id="format-toggle-btn" onclick="toggleTimeFormat()">24時間制</button>
      </div>

      <span class="menu-section-title">4. 表示・演出オプション</span>
      <div class="menu-grid">
        <button class="menu-btn" id="sec-toggle-btn" onclick="toggleSeconds()">秒表示: ON</button>
        <button class="menu-btn" id="change-panel-btn" onclick="toggleChangePanel()">前日比: 表示</button>
        <button class="menu-btn" id="flash-toggle-btn" onclick="toggleFlashSetting()">白点滅: ON</button>
        <button class="menu-btn" id="neon-toggle-btn" onclick="toggleNeon()">ネオン光: OFF</button>
        <button class="menu-btn" id="scanline-toggle-btn" onclick="toggleScanlines()">CRT走査線: OFF</button>
        <button class="menu-btn" id="layout-toggle-btn" onclick="toggleVerticalLayout()">縦型表示: OFF</button>
      </div>

      <span class="menu-section-title">5. 数字フォント</span>
      <div class="menu-grid">
        <button class="menu-btn" onclick="setFont('Courier New, monospace')">デジタル (等幅)</button>
        <button class="menu-btn" onclick="setFont('sans-serif')">ゴシック体</button>
        <button class="menu-btn" onclick="setFont('serif')">明朝体</button>
        <button class="menu-btn" onclick="setFont('Arial Black, sans-serif')">極太インパクト</button>
      </div>

      <span class="menu-section-title">6. 効果音</span>
      <div class="menu-grid">
        <button class="menu-btn" id="sound-time-btn" onclick="toggleTimeSound()">時報(ポーン): OFF</button>
        <button class="menu-btn" id="sound-flash-btn" onclick="toggleFlashSound()">更新効果音: OFF</button>
      </div>

      <span class="menu-section-title">7. テロップ動作テスト</span>
      <div class="menu-grid">
        <button class="menu-btn" onclick="testEEW(3)">【EEW予報】黄</button>
        <button class="menu-btn" onclick="testEEW(5)">【EEW警報】赤</button>
        <button class="menu-btn" onclick="testShindo()">【震度情報】青</button>
        <button class="menu-btn" onclick="testTsunami()">【津波情報】橙</button>
      </div>

      <span class="menu-section-title">8. システム操作</span>
      <div class="menu-grid">
        <button class="menu-btn" onclick="toggleFullScreen()">全画面表示 (F11)</button>
        <button class="menu-btn" onclick="location.reload()">再読み込み</button>
      </div>
    </div>

    <div class="alert-bar" id="alert-bar">
      <span class="alert-title" id="alert-title">【緊急地震速報】</span>
      <span class="alert-text" id="alert-text">---</span>
    </div>

    <div class="header">
      <span class="header-title-jp" id="title-jp">日経平均株価</span>
      <span class="header-title-en" id="title-en">Nikkei 225</span>
    </div>

    <div class="main-body" id="main-body">
      <div class="label-box">
        <span class="label-jp">現在値</span>
        <span class="label-en">Current</span>
      </div>
      <div class="current-value-panel" id="current-panel">
        <span class="time-text" id="clock-display">00:00:00</span>
      </div>

      <div class="label-box" id="change-label-box">
        <span class="label-jp">前日比</span>
        <span class="label-en">Change</span>
      </div>
      <div class="change-value-panel" id="change-value-panel">
        <span class="change-text" id="date-display">+0.00</span>
      </div>

      <div class="details-container">
        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">始値</span>
            <span class="label-en">Open</span>
          </div>
          <div class="detail-value" id="open-display">2026.07.24</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">高値</span>
            <span class="label-en">High</span>
          </div>
          <div class="detail-value" id="high-display">FRIDAY</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">安値</span>
            <span class="label-en">Low</span>
          </div>
          <div class="detail-value" id="low-display">JST (UTC+9)</div>
        </div>
      </div>
    </div>

    <div class="footer-line"></div>
  </div>

  <script>
    let isFlashing = false;
    let allowFlash = true;
    let showSeconds = true;
    let is24Hour = true;
    let showChange = true;
    let soundTime = false;
    let soundFlash = false;
    let isNeon = false;
    let isScanlines = false;
    let isVertical = false;
    let alertTimer = null;
    let currentMode = 'nikkei';
    let tzOffset = 0;
    let tzName = "JST (UTC+9)";
    let dateFormatIndex = 0;

    const modeConfigs = {
      nikkei:    { jp: "日経平均株価", en: "Nikkei 225", prefix: "+" },
      topix:     { jp: "TOPIX", en: "Tokyo Stock Price Index", prefix: "+" },
      usdjpy:    { jp: "外国為替", en: "USD / JPY", prefix: "¥" },
      dow:       { jp: "NYダウ", en: "Dow Jones Industrial", prefix: "+" },
      btc:       { jp: "ビットコイン", en: "Bitcoin / JPY", prefix: "₿" },
      eth:       { jp: "イーサリアム", en: "Ethereum / JPY", prefix: "Ξ" },
      nasdaq:    { jp: "NASDAQ", en: "NASDAQ Composite", prefix: "+" },
      sp500:     { jp: "S&P 500", en: "S&P 500 Index", prefix: "+" },
      gold:      { jp: "金先物", en: "Gold Futures", prefix: "$" },
      oil:       { jp: "原油先物", en: "WTI Crude Oil", prefix: "$" },
      jgb:       { jp: "日本10年国債", en: "JGB 10Y Yield", prefix: "%" },
      nkfutures: { jp: "日経225先物", en: "Nikkei 225 Futures", prefix: "+" }
    };

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    // アラート音再生
    function playAlertSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (type === 'eew-alert') {
        for (let i = 0; i < 3; i++) {
          setTimeout(() => playBeep(1046.5, 0.15), i * 350);
          setTimeout(() => playBeep(1318.5, 0.2),  i * 350 + 150);
        }
      } else if (type === 'eew-warning') {
        playBeep(880, 0.12);
        setTimeout(() => playBeep(659.25, 0.2), 150);
      } else if (type === 'seismic') {
        playBeep(523.25, 0.25);
      } else if (type === 'tsunami') {
        playBeep(440, 0.4);
        setTimeout(() => playBeep(349.23, 0.5), 450);
      }
    }

    // 時計更新
    function updateClock() {
      const now = new Date();
      const targetTime = new Date(now.getTime() + tzOffset * 3600 * 1000);

      let hours = targetTime.getHours();
      const minutes = String(targetTime.getMinutes()).padStart(2, '0');
      const seconds = String(targetTime.getSeconds()).padStart(2, '0');

      if (!is24Hour) { hours = hours % 12 || 12; }
      hours = String(hours).padStart(2, '0');

      let timeStr = `${hours}:${minutes}`;
      if (showSeconds) timeStr += `:${seconds}`;

      document.getElementById('clock-display').innerText = timeStr;

      const config = modeConfigs[currentMode];
      const mockChange = (Math.sin(now.getTime() / 1000) * 12 + 105).toFixed(2);
      document.getElementById('date-display').innerText = `${config.prefix}${mockChange}`;

      const year  = targetTime.getFullYear();
      const month = String(targetTime.getMonth() + 1).padStart(2, '0');
      const date  = String(targetTime.getDate()).padStart(2, '0');
      const weekdays = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

      let dateStr = `${year}.${month}.${date}`;
      if (dateFormatIndex === 1) dateStr = `${year}年${month}月${date}日`;
      if (dateFormatIndex === 2) dateStr = `${month}/${date}/${year}`;

      document.getElementById('open-display').innerText = dateStr;
      document.getElementById('high-display').innerText = weekdays[targetTime.getDay()];
      document.getElementById('low-display').innerText = tzName;

      if (soundTime && now.getSeconds() === 0) playBeep(880, 0.8);
    }

    // 操作UI関数
    function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }

    function setMode(mode, btnEl) {
      currentMode = mode;
      const config = modeConfigs[mode];
      document.getElementById('title-jp').innerText = config.jp;
      document.getElementById('title-en').innerText = config.en;
      if (btnEl) {
        btnEl.parentElement.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }
      updateClock();
    }

    function setTheme(theme) {
      const mainBody = document.getElementById('main-body');
      mainBody.className = "main-body";
      if (theme !== 'blue') mainBody.classList.add(`theme-${theme}`);
    }

    function setTimezone(zone, label) {
      tzName = label;
      if (zone === 'JST') tzOffset = 0;
      if (zone === 'UTC') tzOffset = -9;
      if (zone === 'EST') tzOffset = -14;
      if (zone === 'GMT') tzOffset = -9;
      updateClock();
    }

    function rotateDateFormat() {
      dateFormatIndex = (dateFormatIndex + 1) % 3;
      const labels = ["YYYY.MM.DD", "YYYY年MM月DD日", "MM/DD/YYYY"];
      document.getElementById('date-fmt-btn').innerText = `日付形式: ${labels[dateFormatIndex]}`;
      updateClock();
    }

    function toggleSeconds() {
      showSeconds = !showSeconds;
      document.getElementById('sec-toggle-btn').innerText = `秒表示: ${showSeconds ? 'ON' : 'OFF'}`;
      updateClock();
    }

    function toggleTimeFormat() {
      is24Hour = !is24Hour;
      document.getElementById('format-toggle-btn').innerText = is24Hour ? "24時間制" : "12時間制";
      updateClock();
    }

    function toggleChangePanel() {
      showChange = !showChange;
      document.getElementById('change-label-box').style.display = showChange ? 'flex' : 'none';
      document.getElementById('change-value-panel').style.display = showChange ? 'block' : 'none';
      document.getElementById('change-panel-btn').innerText = `前日比: ${showChange ? '表示' : '非表示'}`;
    }

    function toggleNeon() {
      isNeon = !isNeon;
      document.getElementById('title-jp').classList.toggle('neon', isNeon);
      document.getElementById('neon-toggle-btn').innerText = `ネオン光: ${isNeon ? 'ON' : 'OFF'}`;
    }

    function toggleScanlines() {
      isScanlines = !isScanlines;
      document.getElementById('scanlines').style.display = isScanlines ? 'block' : 'none';
      document.getElementById('scanline-toggle-btn').innerText = `CRT走査線: ${isScanlines ? 'ON' : 'OFF'}`;
    }

    function toggleVerticalLayout() {
      isVertical = !isVertical;
      document.getElementById('screen-container').classList.toggle('layout-vertical', isVertical);
      document.getElementById('layout-toggle-btn').innerText = `縦型表示: ${isVertical ? 'ON' : 'OFF'}`;
    }

    function setFont(fontFamily) {
      document.querySelectorAll('.time-text, .change-text, .detail-value').forEach(el => el.style.fontFamily = fontFamily);
    }

    function toggleFlashSetting() {
      allowFlash = !allowFlash;
      document.getElementById('flash-toggle-btn').innerText = `白点滅: ${allowFlash ? 'ON' : 'OFF'}`;
    }

    function toggleTimeSound() {
      soundTime = !soundTime;
      document.getElementById('sound-time-btn').innerText = `時報(ポーン): ${soundTime ? 'ON' : 'OFF'}`;
    }

    function toggleFlashSound() {
      soundFlash = !soundFlash;
      document.getElementById('sound-flash-btn').innerText = `更新効果音: ${soundFlash ? 'ON' : 'OFF'}`;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    function checkRandomFlash() {
      if (!allowFlash || isFlashing) return;
      if (Math.random() < 0.3) {
        isFlashing = true;
        const panel = document.getElementById('current-panel');
        panel.classList.add('flash-active');
        if (soundFlash) playBeep(1200, 0.05);

        setTimeout(() => {
          panel.classList.remove('flash-active');
          isFlashing = false;
        }, Math.floor(Math.random() * 500) + 500);
      }
    }

    // テロップ表示＆音再生処理
    function showAlert(title, text, styleClass, soundType) {
      const bar = document.getElementById('alert-bar');
      document.getElementById('alert-title').innerText = title;
      document.getElementById('alert-text').innerText = text;
      bar.className = "alert-bar " + styleClass;
      bar.style.display = "block";

      if (soundType) playAlertSound(soundType);

      if (alertTimer) clearTimeout(alertTimer);
      alertTimer = setTimeout(() => { bar.style.display = "none"; }, 50000);
    }

    // 手動テスト
    function testEEW(scale) {
      if (scale < 5) {
        showAlert("【緊急地震速報（予報）】", "千葉県沖で地震 予想最大震度：3", "eew-warning", "eew-warning");
      } else {
        showAlert("【緊急地震速報（警報）】", "茨城県沖で地震 予想最大震度：5弱 強い揺れに警戒", "eew-alert", "eew-alert");
      }
    }
    function testShindo() { showAlert("【震度情報】", "最大震度4を観測した地震が発生しました（震源：日向灘）", "seismic-info", "seismic"); }
    function testTsunami() { showAlert("【津波注意報】", "太平洋沿岸に津波注意報が発表されました", "tsunami-info", "tsunami"); }

    // リアルタイム防災API
    async function checkRealDisasterAPI() {
      try {
        const res = await fetch('https://api.p2pquake.net/v2/history?codes=551,552,554&limit=1');
        const data = await res.json();
        if (!data || data.length === 0) return;
        const info = data[0];

        if (info.code === 551 && info.earthquake && info.earthquake.hypocenter) {
          const area = info.earthquake.hypocenter.name || "不明";
          const maxScaleNum = info.earthquake.maxScale ? (info.earthquake.maxScale / 10) : 0;
          if (maxScaleNum >= 4.5) {
            showAlert("【緊急地震速報（警報）】", `震源地：${area} / 予想最大震度：5弱以上`, "eew-alert", "eew-alert");
          } else {
            showAlert("【緊急地震速報（予報）】", `震源地：${area} / 予想最大震度：${maxScaleNum || '1〜4'}`, "eew-warning", "eew-warning");
          }
        } else if (info.code === 552 && info.earthquake && info.earthquake.maxScale >= 30) {
          const area = info.earthquake.hypocenter.name || "各地";
          showAlert("【震度情報】", `最大震度${info.earthquake.maxScale / 10}を観測（震源：${area}）`, "seismic-info", "seismic");
        } else if (info.code === 554) {
          showAlert("【津波情報】", "海岸付近の方はただちに高台へ避難してください", "tsunami-info", "tsunami");
        }
      } catch (e) {}
    }

    setInterval(updateClock, 1000);
    setInterval(checkRandomFlash, 1000);
    setInterval(checkRealDisasterAPI, 3000);

    updateClock();
  </script>
</body>
</html>
