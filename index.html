<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日経平均株価風 デジタルクロック</title>
  <style>
    /* ==========================================
       全体レイアウト
       ========================================== */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #000;
      font-family: 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', 'メイリオ', sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .screen-container {
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      background-color: #000;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ==========================================
       1. ヘッダー（黒領域 & 右上LIVEバッジ）
       ========================================== */
    .header {
      background-color: #000;
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title-container {
      display: flex;
      align-items: baseline;
      gap: 15px;
    }
    .header-title-jp {
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .header-title-en {
      font-size: 1.5rem;
      font-weight: bold;
      color: #e2e8f0;
    }

    /* 右上のLIVEバッジ (image_1.jpgを再現) */
    .live-badge {
      display: flex;
      border: 1px solid #fff;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .live-left {
      background-color: #800080; /* 紫背景 */
      color: #fff;
      padding: 4px 8px;
    }
    .live-right {
      background-color: #008000; /* 緑背景 */
      color: #fff;
      padding: 4px 10px;
      text-align: center;
      line-height: 1.1;
    }

    /* ==========================================
       2. メインボディ（鮮やかな青領域）
       ========================================== */
    .main-body {
      flex: 1;
      background-color: #0052cc; /* 画像に近い鮮やかなブルー */
      padding: 1.5rem 2.5rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 15px 20px;
      align-items: center;
    }

    /* 左側の見出しラベル */
    .label-box {
      display: flex;
      flex-direction: column;
    }
    .label-jp {
      font-size: 2.2rem;
      font-weight: bold;
      line-height: 1.1;
    }
    .label-en {
      font-size: 1.2rem;
      color: #cbd5e1;
    }

    /* --- 2a. 現在値（16:11:05）パネル --- */
    .current-value-panel {
      background-color: #e6f0fa; /* 薄い青白色（平常時） */
      border: 4px solid #002b80;
      border-radius: 4px;
      padding: 0.2rem 1.5rem;
      text-align: right;
      transition: background-color 1s ease, color 1s ease; /* じんわり戻るアニメーション */
    }
    .time-text {
      font-size: 5.5rem;
      font-weight: bold;
      color: #00247d; /* 深い青 */
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: -2px;
    }

    /* 毎分00秒で発火するフラッシュ用クラス（画像のように真っ白に） */
    .flash-active {
      background-color: #ffffff !important;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
    }

    /* --- 2b. 前日比（赤いパネル） --- */
    .change-value-panel {
      background-color: #ff3333; /* 鮮やかな赤 */
      border: 2px solid #b30000;
      border-radius: 4px;
      padding: 0.5rem 1.5rem;
      text-align: right;
    }
    .change-text {
      font-size: 3.2rem;
      font-weight: bold;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
    }

    /* --- 2c. 始値・高値・安値（詳細情報リスト） --- */
    .details-container {
      grid-column: 1 / 3;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
    }
    .detail-value {
      font-size: 3rem;
      font-weight: bold;
      text-align: right;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }

    /* 下部の赤ライン */
    .footer-line {
      height: 8px;
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <div class="screen-container">
    <!-- ヘッダー -->
    <div class="header">
      <div class="header-title-container">
        <span class="header-title-jp">日経平均株価</span>
        <span class="header-title-en">Nikkei 225</span>
      </div>
      <div class="live-badge">
        <div class="live-left">LIVE</div>
        <div class="live-right">東京証券取引所<br>寄りつき</div>
      </div>
    </div>

    <!-- メイン画面（画像再現） -->
    <div class="main-body">
      
      <!-- 現在値（時刻＋秒数） -->
      <div class="label-box">
        <span class="label-jp">現在値</span>
        <span class="label-en">Current</span>
      </div>
      <div class="current-value-panel" id="current-panel">
        <span class="time-text" id="clock-display">16:11:00</span>
      </div>

      <!-- 前日比（日付・曜日など） -->
      <div class="label-box">
        <span class="label-jp">前日比</span>
        <span class="label-en">Change</span>
      </div>
      <div class="change-value-panel">
        <span class="change-text" id="date-display">+2026.07.24</span>
      </div>

      <!-- 始値・高値・安値 相当の情報 -->
      <div class="details-container">
        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">始値</span>
            <span class="label-en">Open</span>
          </div>
          <div class="detail-value" id="open-display">2026.07.24</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">高値</span>
            <span class="label-en">High</span>
          </div>
          <div class="detail-value" id="high-display">FRIDAY</div>
        </div>

        <div class="detail-row">
          <div class="label-box">
            <span class="label-jp">安値</span>
            <span class="label-en">Low</span>
          </div>
          <div class="detail-value" id="low-display">JST (UTC+9)</div>
        </div>
      </div>

    </div>

    <!-- 赤いフッターバー -->
    <div class="footer-line"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      const hours   = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const panel = document.getElementById('current-panel');
      const clockDisplay = document.getElementById('clock-display');

      // 1. 時:分:秒 を表示
      clockDisplay.innerText = `${hours}:${minutes}:${seconds}`;

      // 2. 毎分 00 秒になった瞬間に白くフラッシュさせる（1分おきの変化演出）
      if (seconds === '00') {
        panel.classList.add('flash-active');
        
        // 1.5秒後に元に戻す
        setTimeout(() => {
          panel.classList.remove('flash-active');
        }, 1500);
      }

      // 日付等の設定
      const year  = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date  = String(now.getDate()).padStart(2, '0');
      
      const weekdays = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      
      document.getElementById('date-display').innerText = `+${month}.${date}`;
      document.getElementById('open-display').innerText = `${year}.${month}.${date}`;
      document.getElementById('high-display').innerText = weekdays[now.getDay()];
    }

    // 1秒ごとに実行
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
